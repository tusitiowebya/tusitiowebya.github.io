<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:630px;overflow:hidden;font-family:'Manrope',sans-serif;position:relative;background:#0A2B26;}
.bg{position:absolute;inset:0;background:
  radial-gradient(760px 500px at 88% 8%, rgba(232,163,61,.35), transparent 60%),
  linear-gradient(120deg, #0A2B26 0%, #0E3B34 55%, #123F38 100%);}
.photo{position:absolute;right:0;top:0;bottom:0;width:46%;
  background:url('../images/auto.jpg') center/cover;
  clip-path:polygon(18% 0,100% 0,100% 100%,0% 100%);}
.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(10,43,38,.95), rgba(10,43,38,.15) 40%, transparent 70%);}
.content{position:relative;z-index:2;padding:70px 64px;width:640px;height:100%;display:flex;flex-direction:column;justify-content:center;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px;}
.brand span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:#fff;}
.eyebrow{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.14em;color:#F4C77A;margin-bottom:20px;}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:52px;line-height:1.08;color:#fff;margin-bottom:20px;}
h1 span{color:#F4C77A;}
p{font-size:19px;color:rgba(255,255,255,.82);line-height:1.5;max-width:480px;margin-bottom:30px;}
.tags{display:flex;gap:10px;}
.tags span{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.35);padding:8px 16px;border-radius:100px;}
</style></head>
<body>
<div class="bg"></div>
<div class="photo"></div>
<div class="content">
  <div class="brand">
    <svg width="30" height="34" viewBox="0 0 44 50"><path d="M22 1 L42 9 V23 C42 37 33 46 22 49 C11 46 2 37 2 23 V9 Z" fill="none" stroke="#E8A33D" stroke-width="2.4"/><path d="M14 25 L20 31 L31 18" fill="none" stroke="#E8A33D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Segurflex</span>
  </div>
  <span class="eyebrow">— PROTECCIÓN 100% ONLINE —</span>
  <h1>Tu seguro, cotizado<br>en minutos. <span>Sin vueltas.</span></h1>
  <p>Auto, moto, hogar y comercio. Comparamos coberturas y te asesoramos sin vueltas.</p>
  <div class="tags"><span>Auto</span><span>Moto</span><span>Hogar</span><span>Comercio</span></div>
</div>
</body></html>
