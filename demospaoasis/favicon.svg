<script>
// ---- frond generator: espina curva + lobulos serrados ----
function frond(x0, y0, ang, len, width, lobes, curve){
  const rad = a => a*Math.PI/180;
  // spine points
  const pts=[];
  for(let i=0;i<=lobes;i++){
    const t=i/lobes;
    const a=rad(ang + curve*t*t);
    // integrate roughly: use quadratic-ish position
    const aa=rad(ang + curve*t*t*0.5);
    pts.push([x0+Math.cos(aa)*len*t, y0+Math.sin(aa)*len*t, a, t]);
  }
  const off=(p,s)=>[p[0]+Math.cos(p[2]+Math.PI/2)*s, p[1]+Math.sin(p[2]+Math.PI/2)*s];
  const w=t=>width*Math.sin(Math.PI*Math.min(1,0.15+t*0.85))*(1-0.25*t);
  let d='';
  // lado A (de base a punta) con lobulos
  for(let i=0;i<pts.length;i++){
    const p=pts[i], t=p[3];
    const tip=off(p, w(t));
    if(i===0){ d+=`M ${p[0].toFixed(1)} ${p[1].toFixed(1)} `; continue; }
    const prev=pts[i-1];
    const mid=[(prev[0]+p[0])/2,(prev[1]+p[1])/2,(prev[2]+p[2])/2,(prev[3]+p[3])/2];
    const midOut=off(mid, w(mid[3])*1.08);
    d+=`Q ${midOut[0].toFixed(1)} ${midOut[1].toFixed(1)} ${tip[0].toFixed(1)} ${tip[1].toFixed(1)} `;
    // muesca parcial (no llega a la espina: la fronda queda entera)
    const notch=off(p, w(t)*0.34);
    d+=`L ${notch[0].toFixed(1)} ${notch[1].toFixed(1)} `;
  }
  // punta
  const last=pts[pts.length-1];
  d+=`L ${last[0].toFixed(1)} ${last[1].toFixed(1)} `;
  // lado B (de punta a base)
  for(let i=pts.length-1;i>0;i--){
    const p=pts[i], prev=pts[i-1];
    const tip=off(prev, -w(prev[3]));
    const mid=[(prev[0]+p[0])/2,(prev[1]+p[1])/2,(prev[2]+p[2])/2,(prev[3]+p[3])/2];
    const midOut=off(mid, -w(mid[3])*1.08);
    const notch=off(p, -w(p[3])*0.34);
    d+=`L ${notch[0].toFixed(1)} ${notch[1].toFixed(1)} `;
    d+=`Q ${midOut[0].toFixed(1)} ${midOut[1].toFixed(1)} ${tip[0].toFixed(1)} ${tip[1].toFixed(1)} `;
  }
  d+='Z';
  return d;
}

const G1='#57B532', G2='#3F9526';
// fronds: [angulo, largo, ancho, lobulos, curvatura, color]
const F=[
  [186, 222, 44, 5, -54, G2],
  [-6,  216, 44, 5,  54, G2],
  [210, 188, 40, 5, -62, G1],
  [-30, 184, 40, 5,  62, G1],
  [238, 158, 36, 4, -66, G2],
  [-58, 156, 36, 4,  66, G2],
  [266, 126, 32, 4, -40, G1],
  [-86, 124, 32, 4,  40, G1]
];
const px=512, py=430;
let fr='';
F.forEach(f=>{ fr+=`<path d="${frond(px,py,f[0],f[1],f[2],f[3],f[4])}" fill="${f[5]}"/>`; });

const svg=`
