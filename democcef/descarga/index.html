<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu descarga | Creciendo con el Fútbol</title>
<meta name="description" content="Acá está el material que compraste en Creciendo con el Fútbol Capacitaciones: descargas, accesos y licencias de tu pedido.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07120C">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .dsc { min-height: 100dvh; display: grid; place-items: center; padding: 6rem 1.2rem 4rem; }
  .dsc-caja { width: min(100%, 660px); }
  .dsc-tarjeta {
    border: 1px solid rgba(239, 243, 233, .16);
    border-radius: var(--radio);
    background: linear-gradient(180deg, rgba(239, 243, 233, .05), rgba(239, 243, 233, .015));
    padding: clamp(1.4rem, 4vw, 2.2rem);
  }
  .dsc h1 { font-size: clamp(1.9rem, 5.4vw, 3rem); margin: .6rem 0 .8rem; }
  .dsc-estado {
    display: inline-flex; align-items: center; gap: .5rem;
    border: 1px solid rgba(44, 194, 87, .45); background: rgba(44, 194, 87, .12);
    border-radius: 999px; padding: .35rem .8rem; font-size: .74rem;
    letter-spacing: .14em; text-transform: uppercase; color: var(--cesped);
  }
  .dsc-estado.vencido { border-color: rgba(242, 226, 63, .45); background: rgba(242, 226, 63, .12); color: var(--amarillo); }
  .dsc-bloque { margin-top: 1.6rem; }
  .dsc-bloque h2 { font-size: 1.05rem; font-family: var(--f-texto); text-transform: uppercase; letter-spacing: .16em; color: var(--gris); font-weight: 600; margin-bottom: .7rem; }
  .dsc-item {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    border: 1px solid rgba(239, 243, 233, .16); border-radius: 10px;
    padding: .85rem 1rem; margin-bottom: .55rem; font-size: .9rem;
  }
  .dsc-item small { display: block; color: var(--gris); font-size: .74rem; }
  .dsc-copia { background: rgba(7, 18, 12, .6); border: 1px dashed rgba(239, 243, 233, .25); border-radius: 10px; padding: .8rem 1rem; font-family: ui-monospace, Menlo, monospace; font-size: .88rem; margin-bottom: .55rem; word-break: break-all; }
  .dsc-meta { display: flex; flex-wrap: wrap; gap: 1.4rem; margin-top: 1.6rem; padding-top: 1.2rem; border-top: 1px solid rgba(239, 243, 233, .14); }
  .dsc-meta div span { display: block; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
  .dsc-meta div b { font-size: .95rem; }
  .dsc-pie { margin-top: 1.6rem; font-size: .84rem; color: var(--gris); text-align: center; }
  .dsc-pie a { color: var(--cesped); }
</style>
</head>
<body data-base="../">

<main class="dsc">
  <div class="dsc-caja">
    <a class="marca" href="../" style="margin-bottom:1.6rem">
      <svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#2CC257"/>
        <rect x="6.5" y="6.5" width="51" height="51" rx="12.5" fill="none" stroke="#F2E23F" stroke-width="2.5"/>
        <circle cx="32" cy="32" r="14" fill="#EFF3E9"/>
        <path d="M32 21.5l6.4 4.6-2.4 7.5h-8L25.6 26z" fill="#07120C"/>
      </svg>
      <span class="marca-txt"><b>Creciendo con el Fútbol</b><span>Tu descarga</span></span>
    </a>
    <div class="dsc-tarjeta" id="caja">
      <p style="color:var(--gris)">Buscando tu material…</p>
    </div>
    <p class="dsc-pie">¿Se te venció el enlace o no te llegó el mail? <a id="waAyuda" href="#" target="_blank" rel="noopener">Escribinos y te lo reenviamos</a>.</p>
  </div>
</main>

<script src="../config.js"></script>
<script src="descarga.js"></script>
</body>
</html>
